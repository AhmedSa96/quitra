<div class="w-10 h-10 rounded-full overflow-hidden bg-surface-container-high">

<button class="w-10 h-10 flex items-center justify-center rounded-full text-teal-700 dark:text-teal-400 hover:bg-teal-50/50 transition-colors active:scale-95 duration-150">

</button>
</div>

<main class="pt-24 px-6 max-w-screen-md mx-auto space-y-10">
<!-- Hero Greeting -->
<section class="text-center space-y-2">
<h2 class="text-4xl font-extrabold tracking-tight text-on-surface">Day 5 smoke-free</h2>
<p class="text-lg text-on-surface-variant font-medium">You’re doing great</p>
</section>
<!-- Primary Action: Urge Support -->
<section class="flex justify-center py-8">
<div class="relative group">
<!-- Decorative Glow -->
<div class="absolute inset-0 bg-primary opacity-20 blur-3xl rounded-full group-hover:opacity-30 transition-opacity"></div>
<button class="relative bg-gradient-to-br from-primary to-primary-container text-on-primary px-10 py-10 rounded-full shadow-2xl flex flex-col items-center justify-center gap-2 active:scale-90 transition-transform duration-200 aspect-square w-64 h-64 border-8 border-surface-container-lowest">
<span class="material-symbols-outlined text-4xl" data-icon="wind_power">wind_power</span>
<span class="text-xl font-bold tracking-tight">I feel like smoking</span>
<span class="text-xs opacity-80 font-medium">TAP FOR BREATHING</span>
</button>
</div>
</section>
<!-- Metrics Bento Grid -->
<section class="grid grid-cols-1 md:grid-cols-3 gap-4">
<!-- Money Saved -->
<div class="bg-surface-container-low p-6 rounded-lg flex flex-col items-center text-center space-y-2">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container mb-2">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
</div>
<span class="text-2xl font-extrabold text-on-surface">$12.50</span>
<span class="text-xs font-bold uppercase tracking-widest text-on-surface-variant">Money saved</span>
</div>
<!-- Cigarettes Avoided -->
<div class="bg-surface-container-low p-6 rounded-lg flex flex-col items-center text-center space-y-2">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container mb-2">
<span class="material-symbols-outlined" data-icon="smoke_free">smoke_free</span>
</div>
<span class="text-2xl font-extrabold text-on-surface">42</span>
<span class="text-xs font-bold uppercase tracking-widest text-on-surface-variant">Avoided</span>
</div>
<!-- Time Smoke-Free -->
<div class="bg-surface-container-low p-6 rounded-lg flex flex-col items-center text-center space-y-2">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container mb-2">
<span class="material-symbols-outlined" data-icon="timer">timer</span>
</div>
<span class="text-2xl font-extrabold text-on-surface">5d 4h</span>
<span class="text-xs font-bold uppercase tracking-widest text-on-surface-variant">Time free</span>
</div>
</section>

<div class="flex flex-col md:flex-row md:items-center justify-between gap-6">

<h3 class="text-xl font-bold text-on-surface">Daily check-in</h3>
<p class="text-on-surface-variant">How was today?</p>
</div>
<div class="flex gap-3">
<button class="w-14 h-14 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface hover:bg-tertiary-fixed transition-colors active:scale-95">
<span class="material-symbols-outlined" data-icon="sentiment_dissatisfied">sentiment_dissatisfied</span>
</button>
<button class="w-14 h-14 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface hover:bg-secondary-container transition-colors active:scale-95">
<span class="material-symbols-outlined" data-icon="sentiment_neutral">sentiment_neutral</span>
</button>
<button class="w-14 h-14 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface hover:bg-primary-fixed transition-colors active:scale-95">
<span class="material-symbols-outlined" data-icon="sentiment_satisfied">sentiment_satisfied</span>
</button>
</div>
</div>
<!-- Aesthetic Background Texture -->
<div class="absolute -bottom-12 -right-12 w-32 h-32 bg-primary/5 rounded-full blur-3xl"></div>
</section>
<!-- Motivational Quote Section -->
<section class="py-4">
<div class="p-8 breath-module rounded-lg text-center italic text-on-surface-variant/80 border border-primary/5">

<span class="material-symbols-outlined" data-icon="auto_stories">auto_stories</span>
<span class="font-manrope text-[11px] font-medium tracking-wide">Journey</span>
</a>

<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-5 py-2 hover:text-teal-700 transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-manrope text-[11px] font-medium tracking-wide">Settings</span>
</a>
