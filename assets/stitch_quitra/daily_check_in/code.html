<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Quitra - Daily Check-in</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-highest": "#dce2f7",
                    "on-primary": "#ffffff",
                    "tertiary-container": "#9c573a",
                    "surface-variant": "#dce2f7",
                    "tertiary": "#7f4025",
                    "secondary-container": "#c5e6e1",
                    "surface-dim": "#d3daef",
                    "surface-container": "#e9edff",
                    "surface-container-low": "#f1f3ff",
                    "on-tertiary-fixed": "#370e00",
                    "surface-container-high": "#e1e8fd",
                    "on-error-container": "#93000a",
                    "secondary-fixed-dim": "#accdc8",
                    "on-background": "#141b2b",
                    "on-tertiary-fixed-variant": "#72361b",
                    "on-secondary-fixed": "#00201d",
                    "secondary": "#466460",
                    "tertiary-fixed": "#ffdbce",
                    "on-tertiary-container": "#ffe5db",
                    "on-primary-container": "#a3faef",
                    "on-primary-fixed": "#00201d",
                    "on-surface": "#141b2b",
                    "on-tertiary": "#ffffff",
                    "inverse-surface": "#293040",
                    "background": "#f9f9ff",
                    "inverse-on-surface": "#edf0ff",
                    "primary-fixed-dim": "#80d5cb",
                    "secondary-fixed": "#c8e9e4",
                    "error": "#ba1a1a",
                    "primary-fixed": "#9cf2e8",
                    "primary": "#005c55",
                    "inverse-primary": "#80d5cb",
                    "surface-tint": "#006a63",
                    "primary-container": "#0f766e",
                    "on-secondary-container": "#4a6864",
                    "outline": "#6e7977",
                    "on-surface-variant": "#3e4947",
                    "tertiary-fixed-dim": "#ffb598",
                    "surface": "#f9f9ff",
                    "on-primary-fixed-variant": "#00504a",
                    "on-error": "#ffffff",
                    "error-container": "#ffdad6",
                    "surface-bright": "#f9f9ff",
                    "on-secondary-fixed-variant": "#2e4c48",
                    "on-secondary": "#ffffff",
                    "outline-variant": "#bdc9c6",
                    "surface-container-lowest": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Manrope"],
                    "body": ["Manrope"],
                    "label": ["Manrope"]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            background: #005c55;
            border-radius: 50%;
            cursor: pointer;
            border: 4px solid #ffffff;
            box-shadow: 0 2px 8px rgba(0,92,85,0.2);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen">
<!-- Background Layer (Home Screen) -->
<div class="fixed inset-0 z-0 overflow-hidden px-6 pt-24 pb-32 flex flex-col gap-8 opacity-40 grayscale pointer-events-none">
<!-- Dashboard Header -->
<div class="flex flex-col gap-2">
<h1 class="text-4xl font-extrabold tracking-tight text-on-surface">Good morning, Alex</h1>
<p class="text-on-surface-variant">You've been smoke-free for 12 days.</p>
</div>
<!-- Bento Grid Mockup -->
<div class="grid grid-cols-2 gap-4">
<div class="col-span-2 bg-surface-container-low h-48 rounded-lg flex items-end p-6">
<div class="w-full bg-surface-container-highest h-24 rounded-md"></div>
</div>
<div class="bg-secondary-container h-32 rounded-lg"></div>
<div class="bg-surface-container-high h-32 rounded-lg"></div>
</div>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-[60] bg-on-background/20 backdrop-blur-sm flex items-end md:items-center justify-center p-0 md:p-6">
<!-- Check-in Modal Card -->
<div class="bg-surface-container-lowest w-full max-w-lg rounded-t-xl md:rounded-lg shadow-2xl overflow-hidden relative border-t md:border-none border-outline-variant/10">
<!-- Modal Header -->
<div class="px-8 pt-8 pb-6 flex justify-between items-start">
<div class="space-y-1">
<span class="text-primary font-bold tracking-widest text-[10px] uppercase">Daily Ritual</span>
<h2 class="text-2xl font-extrabold text-on-surface tracking-tight leading-none">Daily Check-in</h2>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Modal Content -->
<div class="px-8 pb-10 space-y-10">
<!-- Question 1: Smoking Status -->
<div class="space-y-4">
<label class="text-lg font-bold text-on-surface block">Did you smoke today?</label>
<div class="flex gap-4">
<button class="flex-1 py-4 rounded-full font-bold text-on-primary bg-primary transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]" data-weight="fill">check_circle</span>
                            No
                        </button>
<button class="flex-1 py-4 rounded-full font-bold text-on-secondary-container bg-surface-container-low hover:bg-surface-container-high transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">cancel</span>
                            Yes
                        </button>
</div>
</div>
<!-- Question 2: Craving Slider -->
<div class="space-y-6">
<div class="flex justify-between items-end">
<label class="text-lg font-bold text-on-surface">Craving level</label>
<span class="text-primary font-extrabold text-2xl">3<span class="text-sm font-medium text-on-surface-variant ml-1">/ 5</span></span>
</div>
<div class="relative pt-2">
<input class="slider-thumb w-full h-2 bg-surface-container-high rounded-full appearance-none cursor-pointer" max="5" min="1" type="range" value="3"/>
<div class="flex justify-between mt-4 px-1">
<span class="text-[11px] font-bold text-on-surface-variant uppercase tracking-wider">None</span>
<span class="text-[11px] font-bold text-on-surface-variant uppercase tracking-wider">Intense</span>
</div>
</div>
</div>
<!-- Question 3: Optional Note -->
<div class="space-y-4">
<label class="text-lg font-bold text-on-surface block">Optional note</label>
<textarea class="w-full bg-surface-container-high border-none rounded-lg p-5 text-on-surface placeholder:text-on-surface-variant/50 focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all min-h-[120px] resize-none" placeholder="How are you feeling? Any triggers?"></textarea>
</div>
<!-- Action Button -->
<div class="pt-4">
<button class="w-full py-5 rounded-full bg-gradient-to-r from-primary to-primary-container text-on-primary font-extrabold text-lg shadow-lg shadow-primary/20 active:scale-95 transition-transform">
                        Save Check-in
                    </button>
<p class="text-center text-[11px] text-on-surface-variant mt-6 font-medium uppercase tracking-[0.2em]">Consistency is your strongest tool</p>
</div>
</div>
<!-- Decorative Element -->
<div class="absolute top-0 right-0 p-4 pointer-events-none opacity-10">
<span class="material-symbols-outlined text-8xl">spa</span>
</div>
</div>
</div>
<!-- Reusable Top Nav (Hidden by Modal, but structure included for context) -->
<header class="fixed top-0 w-full z-50 bg-slate-50/80 dark:bg-slate-950/80 backdrop-blur-lg">
<div class="flex justify-between items-center px-6 py-4 w-full max-w-screen-xl mx-auto">
<div class="text-2xl font-extrabold text-teal-800 dark:text-teal-200 tracking-tighter">Quitra</div>
<div class="w-10 h-10 rounded-full bg-surface-container-high overflow-hidden">
<img alt="User" class="w-full h-full object-cover" data-alt="professional portrait of a young man with a friendly expression in a bright studio setting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAMdTFi5mPQI_fywBLyH3tkg558Jyq49rVYMtRNgZQzS9PenvO5IFd_t-E38953Nljqbq-7o9wNXUASpwehy_7LDMsv9BFOUjn4HFY19hDYHQpqRLuqEpz4Djk8-pN9TPvgaTYgpR-yvbJLhBMsjMIfz-i2LW_n1oTNRkI_zUlJ3T2RejGhFe6O7bcHV--tz_9s0_8ItVVrOYzGHp4EcFgDt_leXTCD40HZJFdmX0O1K8U1uLLd10FLujygi5pzZVQmtli0tEBp6wjH"/>
</div>
</div>
</header>
<!-- Reusable Bottom Nav (Hidden by Modal) -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pt-3 pb-8 md:pb-6 bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl shadow-[0_-4px_24px_rgba(15,118,110,0.06)] z-50 rounded-t-[2.5rem]">
<div class="flex flex-col items-center justify-center bg-teal-100/50 dark:bg-teal-900/40 text-teal-900 dark:text-teal-100 rounded-full px-5 py-2">
<span class="material-symbols-outlined">home</span>
<span class="font-manrope text-[11px] font-medium tracking-wide">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-5 py-2">
<span class="material-symbols-outlined">insights</span>
<span class="font-manrope text-[11px] font-medium tracking-wide">Progress</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-5 py-2">
<span class="material-symbols-outlined">auto_stories</span>
<span class="font-manrope text-[11px] font-medium tracking-wide">Journey</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-5 py-2">
<span class="material-symbols-outlined">settings</span>
<span class="font-manrope text-[11px] font-medium tracking-wide">Settings</span>
</div>
</nav>
</body></html>
