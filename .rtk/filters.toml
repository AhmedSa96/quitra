# Project-local RTK filters — commit this file with your repo.
# Filters here override user-global and built-in filters.
# Docs: https://github.com/rtk-ai/rtk#custom-filters
schema_version = 1

[filters.flutter-analyze]
description = "Compact Flutter analyze output"
match_command = "^flutter\\s+analyze"
strip_ansi = true
max_lines = 100
strip_lines_matching = [
    "^Analyzing .*",
    "^No issues found!",
]
on_empty = "Flutter: OK"

[filters.flutter-pub]
description = "Compact Flutter pub output"
match_command = "flutter\\s+pub"
strip_ansi = true
strip_lines_matching = [
    "^Resolving dependencies...",
    "^Got dependencies!",
]

[filters.dart-analyze]
description = "Compact Dart analyze output"
match_command = "^dart\\s+analyze"
strip_ansi = true
max_lines = 100
on_empty = "Dart: OK"

[filters.build-runner]
description = "Compact build_runner output"
match_command = "build_runner\\s+build"
strip_ansi = true
keep_lines_matching = ["[SEVERE]", "[WARNING]"]
